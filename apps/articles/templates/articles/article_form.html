{% extends "base.html" %}

{% block title %}{% if is_edit %}Редактировать пост{% else %}Создать пост{% endif %}{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <h2>{% if is_edit %}Редактировать пост{% else %}Создать новый пост{% endif %}</h2>
    <form id="article-form" onsubmit="submitArticle(event)">
        <div style="margin-bottom: 15px;">
            <label>Название</label>
            <input type="text" id="title" class="input" style="width: 100%;" required>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Тема (ID Категории, опционально)</label>
            <input type="number" id="category" class="input" style="width: 100%;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Текст вопроса</label>
            <textarea id="content" class="input" style="width: 100%; height: 200px;" required></textarea>
        </div>

        <button type="submit" class="btn btn--primary" id="submit-btn">Сохранить пост</button>
    </form>
    <div id="error-message" style="color: red; margin-top: 15px;"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const isEdit = {{ is_edit|yesno:"true,false" }};
    const slug = "{{ slug|default:'' }}";

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    async function loadArticle() {
        if (!isEdit) return;
        try {
            const response = await fetch(`/api/questions/${slug}/`);
            if (response.ok) {
                const data = await response.json();
                document.getElementById('title').value = data.title;
                document.getElementById('content').value = data.content;
                document.getElementById('category').value = data.category || '';
            }
        } catch(e) {
            console.error('Failed to load article details.');
        }
    }

    async function submitArticle(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'Сохранение...';

        const title = document.getElementById('title').value;
        const content = document.getElementById('content').value;
        const category = document.getElementById('category').value;

        const formData = new FormData();
        formData.append('title', title);
        formData.append('content', content);

        if (category) formData.append('category', category);

        const url = isEdit ? `/api/questions/${slug}/` : '/api/questions/';
        const method = isEdit ? 'PATCH' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                body: formData
            });

            if (!response.ok) {
                const errData = await response.json();
                document.getElementById('error-message').textContent = 'Ошибка: ' + JSON.stringify(errData);
                btn.disabled = false; btn.textContent = 'Сохранить пост';
                return;
            }

            const data = await response.json();
            window.location.href = `/articles/${data.slug}/`;
        } catch (error) {
            document.getElementById('error-message').textContent = 'Ошибка соединения.';
            btn.disabled = false; btn.textContent = 'Сохранить пост';
        }
    }

    document.addEventListener('DOMContentLoaded', loadArticle);
</script>
{% endblock %}
