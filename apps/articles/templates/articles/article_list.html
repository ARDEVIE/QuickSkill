{% extends "base.html" %}

{% block title %}Все посты{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <h2>Все посты</h2>

    <div style="margin-bottom: 20px; display: flex; gap: 10px;">
        <input type="text" id="search-input" placeholder="Поиск по названию..." class="input" style="flex: 1;">
        <select id="category-filter" class="input">
            <option value="">Все темы</option>
        </select>
        <button onclick="fetchArticles()" class="btn">Искать</button>
        {% if user.is_authenticated %}
        <a href="{% url 'articles_page:create_page' %}" class="btn btn--primary">Создать пост</a>
        {% endif %}
    </div>

    <div id="articles-list">
        <p>Загрузка постов...</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadCategories() {
        try {
            const response = await fetch('/api/courses/categories/'); // Assuming this exists or we can just fetch categories if there's an endpoint
            if (response.ok) {
                const data = await response.json();
                const select = document.getElementById('category-filter');
                data.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = cat.title || cat.name;
                    select.appendChild(option);
                });
            }
        } catch (e) {
            console.error('Could not load categories');
        }
    }

    async function fetchArticles() {
        const search = document.getElementById('search-input').value;
        const category = document.getElementById('category-filter').value;

        let url = '/api/questions/?';
        if (search) url += `search=${encodeURIComponent(search)}&`;
        if (category) url += `category=${category}&`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to load questions');

            const data = await response.json();
            const questions = data.results || data;

            let html = '';
            if (questions.length === 0) {
                html = '<p>Вопросы не найдены.</p>';
            } else {
                questions.forEach(question => {
                    const authorName = question.author.display_name || question.author.username;
                    const date = new Date(question.created_at || Date.now()).toLocaleDateString();
                    html += `
                        <div style="border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px;">
                            <h3 style="margin-top: 0;"><a href="/articles/${question.slug}/">${question.title}</a></h3>
                            <div style="font-size: 0.9em; color: #666; margin-bottom: 10px;">
                                Автор: ${authorName} | Дата: ${date}
                                ${question.category ? `| Тема: ${question.category}` : ''}
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('articles-list').innerHTML = html;
        } catch (error) {
            document.getElementById('articles-list').innerHTML = `<p style="color: red;">${error.message}</p>`;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // loadCategories(); // Skipping dynamic load if no categories endpoint, wait...
        fetchArticles();
    });
</script>
{% endblock %}
