services:
  quickskill-db:
    image: postgres:16-alpine
    env_file:
      - ./backend/settings/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  quickskill-backend:
    build: ./backend
    env_file:
      - ./backend/settings/.env
    environment:
      POSTGRES_HOST: quickskill-db
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      quickskill-db:
        condition: service_healthy

  quickskill-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: npm run start -- --host 0.0.0.0 --poll 2000
    depends_on:
      - quickskill-backend

volumes:
  postgres_data:
  media_data:
