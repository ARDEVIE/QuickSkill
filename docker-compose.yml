services:
  quickskill-db:
    image: postgres:16-alpine
    env_file:
      - ./backend/settings/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  quickskill-backend:
    build: ./backend
    env_file:
      - ./backend/settings/.env
    environment:
      POSTGRES_HOST: quickskill-db
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      quickskill-db:
        condition: service_healthy

  # frontend:
  #   frontend/ (Angular) существует, но ещё не подключён сюда — своя задача
  #   (свой Dockerfile/dev-сервер, порт по умолчанию у `ng serve` — 4200, не
  #   5173, плюс прописать origin в CORS_ALLOWED_ORIGINS / CSRF_TRUSTED_ORIGINS).

volumes:
  postgres_data:
  media_data:
