{% extends "base.html" %}

{% block title %}Регистрация — QuickSkill{% endblock %}

{% block content %}
    <div class="card">
        <h1>Регистрация</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Создать аккаунт</button>
        </form>
        <p>Уже есть аккаунт? <a href="{% url 'users:login' %}">Войти</a></p>
    </div>
{% endblock %}
