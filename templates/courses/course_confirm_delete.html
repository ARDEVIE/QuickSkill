{% extends "base.html" %}

{% block title %}Удалить курс — QuickSkill{% endblock %}

{% block content %}
    <div class="card">
        <h1>Удалить курс «{{ course.title }}»?</h1>
        <p class="helptext">Вместе с курсом удалятся все его материалы. Это необратимо.</p>
        <form method="post">
            {% csrf_token %}
            <div class="actions-row">
                <button type="submit" class="btn">Да, удалить</button>
                <a href="{% url 'courses:course_detail' course.pk %}" class="btn btn--ghost">Отмена</a>
            </div>
        </form>
    </div>
{% endblock %}
