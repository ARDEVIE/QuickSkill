{% extends "base.html" %}

{% block title %}Добавить материал — QuickSkill{% endblock %}

{% block content %}
    <div class="card">
        <h1>Добавить материал</h1>
        <p class="helptext">Курс: {{ course.title }}</p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <p class="helptext">Для PDF заполните только файл, для видео — только ссылку.</p>
            <div class="actions-row">
                <button type="submit" class="btn">Добавить</button>
                <a href="{% url 'courses:course_detail' course.pk %}" class="btn btn--ghost">Отмена</a>
            </div>
        </form>
    </div>
{% endblock %}
