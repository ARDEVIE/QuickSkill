<header class="header">
    <div class="header-container">
  
      <a routerLink="/" class="logo">
        <span class="logo-icon">Q</span>
        <span class="logo-text">quickskill</span>
      </a>
  
      <nav class="navigation">
        <a routerLink="/courses" routerLinkActive="active">
          Каталог
        </a>
        <a routerLink="/forum" routerLinkActive="active">
          Форум
        </a>
        <a routerLink="/create-course" routerLinkActive="active">
          Создать курс
        </a>
        <a routerLink="/forum/ask" routerLinkActive="active">
          Задать вопрос
        </a>
      </nav>
  
      <div class="header-actions">
  

        <ng-container *ngIf="currentUser$ | async as user; else loginLink">
          <div class="user-menu" style="display: flex; align-items: center; gap: 10px;">
            <a routerLink="/profile" class="login-link" style="display: flex; align-items: center; gap: 8px;">
              <img *ngIf="user.avatar" [src]="user.avatar" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">
              <span class="avatar" *ngIf="!user.avatar"></span>
              <span>{{ user.first_name || user.username }}</span>
            </a>
            <button (click)="logout()" style="background: none; border: none; cursor: pointer; color: #666; font-size: 0.9rem;">
              Выйти
            </button>
          </div>
        </ng-container>
        <ng-template #loginLink>
          <a routerLink="/login" class="login-link">
            <span class="avatar"></span>
            <span>Вход / Регистрация</span>
          </a>
        </ng-template>
  
      </div>
  
    </div>
  </header>
