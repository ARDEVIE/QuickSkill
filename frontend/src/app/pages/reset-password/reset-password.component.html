<app-header></app-header>
<main class="auth-page">
  <div class="auth-card">
    <h2>Новый пароль</h2>
    <p>Введите новый пароль для вашего аккаунта.</p>

    <div class="alert success" *ngIf="isSuccess">
      Пароль успешно изменен! Вы можете <a routerLink="/login">войти</a> с новым паролем.
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="!isSuccess">
      <div class="form-group">
        <label>Новый пароль</label>
        <input type="password" formControlName="new_password" placeholder="Минимум 8 символов">
      </div>
      
      <div class="form-group">
        <label>Подтвердите пароль</label>
        <input type="password" formControlName="confirm_password" placeholder="Повторите пароль">
        <div class="error-msg" *ngIf="resetForm.hasError('passwordMismatch') && resetForm.get('confirm_password')?.touched">
          Пароли не совпадают
        </div>
      </div>

      <div class="alert error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="accent-btn" [disabled]="isLoading || resetForm.invalid">
        <span *ngIf="!isLoading">Сохранить</span>
        <span *ngIf="isLoading">Сохранение...</span>
      </button>
    </form>
    
  </div>
</main>
<app-footer></app-footer>
