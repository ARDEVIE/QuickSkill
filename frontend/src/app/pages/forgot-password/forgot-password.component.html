<app-header></app-header>
<main class="auth-page">
  <div class="auth-card">
    <h2>Сброс пароля</h2>
    <p>Введите ваш email, и мы отправим ссылку для восстановления.</p>

    <div class="alert success" *ngIf="isSuccess">
      Если такой email существует, вы получите письмо со ссылкой на сброс.
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!isSuccess">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="student@example.com">
      </div>

      <div class="alert error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="accent-btn" [disabled]="isLoading || forgotForm.invalid">
        <span *ngIf="!isLoading">Отправить</span>
        <span *ngIf="isLoading">Отправка...</span>
      </button>
    </form>
    
    <div class="auth-links">
      <a routerLink="/login">Вернуться ко входу</a>
    </div>
  </div>
</main>
<app-footer></app-footer>
