<div class="create-course-page">
    <app-header></app-header>
  
    <main class="create-container">
      <div class="page-header">
        <div>
          <span class="eyebrow">{{ editSlug ? 'EDIT QUESTION' : 'ASK QUESTION' }}</span>
          <h1>{{ editSlug ? 'Редактировать вопрос' : 'Задать вопрос' }}</h1>
          <p>{{ editSlug ? 'Внесите необходимые изменения.' : 'Опишите вашу проблему максимально подробно.' }}</p>
        </div>
        <a routerLink="/forum" class="back-link">← Вернуться на форум</a>
      </div>
  
      <div class="create-layout single-column">
        <section class="course-form" [formGroup]="questionForm">
          <div *ngIf="errorMessage" class="error-message form-error">
            {{ errorMessage }}
          </div>
  
          <div class="form-section">
            <div class="form-group">
              <label>Заголовок вопроса</label>
              <input type="text" formControlName="title" placeholder="Кратко суть проблемы..." />
            </div>
  
            <div class="form-group">
              <label>Описание</label>
              <textarea rows="10" formControlName="content" placeholder="Опишите, что вы уже пробовали, приложите код или ошибку..."></textarea>
            </div>
  
            <div class="form-group">
              <label>Категория</label>
              <select formControlName="category">
                <option selected disabled value="">Выберите категорию</option>
                <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Прикрепить медиафайл</label>
              <input type="file" (change)="onFileSelected($event)" accept="image/*,video/*" />
              <div class="selected-file-hint" *ngIf="selectedFile">Выбран файл: {{ selectedFile.name }}</div>
            </div>
          </div>
  
          <div class="form-actions">
            <button type="button" class="accent-btn" (click)="onSubmit()" [disabled]="isLoading || questionForm.invalid">
              {{ editSlug ? 'Сохранить изменения' : 'Опубликовать вопрос' }} <span>→</span>
            </button>
          </div>
        </section>
      </div>
    </main>
  
    <app-footer></app-footer>
  </div>
