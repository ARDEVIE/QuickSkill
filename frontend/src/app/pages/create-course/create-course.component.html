<div class="create-course-page">

    <app-header></app-header>

    <main class="create-container">

      <!-- PAGE HEADER -->

      <div class="page-header">

        <div>
          <span class="eyebrow">CREATE COURSE</span>

          <h1>Создай свой курс</h1>

          <p>
            Начни с главного — остальное добавишь в редакторе курса.
          </p>
        </div>

        <a routerLink="/courses" class="back-link">
          ← Вернуться к курсам
        </a>

      </div>


      <!-- STEP 1: DRAFT FORM -->

      <div class="create-layout">

        <section class="course-form" [formGroup]="courseForm">

          <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
          </div>

          <div class="form-section">

            <div class="form-group">
              <label>Название курса</label>
              <input
                type="text"
                formControlName="title"
                placeholder="Например: Основы веб-дизайна"
                autofocus
              />
              <span class="input-hint">Придумай короткое и понятное название.</span>
            </div>

            <div class="form-group">
              <label>Предмет / категория</label>
              <select formControlName="category">
                <option selected value="">Выберите предмет</option>
                <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
              </select>
            </div>

            <div class="form-group">
              <label>Краткое описание <span class="optional-tag">необязательно</span></label>
              <textarea
                rows="3"
                formControlName="description"
                placeholder="Пара предложений о том, чему научится студент"
              ></textarea>
            </div>

            <div class="form-group">
              <label>Обложка <span class="optional-tag">необязательно</span></label>
              <div class="cover-upload cover-upload-compact">
                <button type="button" (click)="fileInput.click()">
                  Выбрать файл
                </button>
                <input type="file" #fileInput (change)="onFileSelected($event)" accept=".png,.jpg,.jpeg,.webp" style="display: none;" />
                <span class="cover-upload-hint" *ngIf="!selectedFile">PNG, JPG или WEBP · до 5 MB</span>
                <span class="cover-upload-hint cover-upload-selected" *ngIf="selectedFile">Выбран файл: {{ selectedFile.name }}</span>
              </div>
            </div>

          </div>

          <div class="form-actions">
            <button type="button" class="secondary-btn" (click)="onCancel()">
              Отмена
            </button>
            <button type="button" class="accent-btn" (click)="onSubmit()" [disabled]="isLoading || courseForm.invalid">
              {{ isLoading ? 'Создаём…' : 'Создать черновик' }}
            </button>
          </div>

        </section>

      </div>
    </main>
    <app-footer></app-footer>
  </div>
