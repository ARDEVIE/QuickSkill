server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Used with a variable in proxy_pass below so the
    # backend hostname is resolved per-request, not once at nginx startup —
    # otherwise nginx refuses to start at all if quickskill-backend isn't up
    # yet, which isn't guaranteed across separately-started Compose projects
    # sharing esg-network.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream quickskill-backend:8000;

    # Proxied straight to Django (Gunicorn). Written as if this project lived
    # at the site root — the shared Public Nginx is responsible for adding
    # and stripping this project's path prefix before requests reach here.
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own static files (admin CSS/JS, DRF browsable API, etc.).
    location /static/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User-uploaded media (course covers, avatars, lesson files).
    location /media/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
