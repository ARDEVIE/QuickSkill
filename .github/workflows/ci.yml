name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quickskill
          POSTGRES_USER: quickskill
          POSTGRES_PASSWORD: quickskill_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quickskill -d quickskill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PROJECT_ENV_ID: dev
      PROJECT_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: quickskill
      POSTGRES_USER: quickskill
      POSTGRES_PASSWORD: quickskill_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test
